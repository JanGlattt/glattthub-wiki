# Cloud Build: Portal hilfe.hub.glattt.com aus dem Wiki-Repo bauen und auf Cloud Run deployen.
# Trigger: Push auf main im Repo JanGlattt/glattthub-wiki (Trigger „deploy-hilfe", Datei dieser Pfad).
# Manuell:  gcloud builds submit --config klickanleitungen/portal/cloudbuild.yaml --substitutions SHORT_SHA=$(git rev-parse --short HEAD) .
#
# Ablauf: Screenshots aus dem Bucket holen (das Repo ist öffentlich, die Bilder liegen deshalb nicht
# darin) → Web-Seiten, Suchindex (Embeddings mit dem OpenAI-Secret) und PDFs bauen → Image → Deploy.
# Der Dienst ist nur über den Load Balancer erreichbar (IAP), siehe Wiki KLICKANLEITUNGEN-PORTAL.md.
substitutions:
  _REGION: "europe-west3"
  _SERVICE: "glattthub-hilfe"
  _AR_REPO: "glattthub-docker"
  _SHOTS_BUCKET: "glattthub-klickanleitungen"
  _IMAGE: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/openai-api-key/versions/latest
      env: OPENAI_API_KEY

steps:
  # 1) Screenshots aus dem Bucket (Struktur <serie>/shots/<name>.png)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: shots
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud storage rsync -r gs://${_SHOTS_BUCKET} klickanleitungen
        echo "Screenshots: $(find klickanleitungen -path '*/shots/*' -type f | wc -l)"

  # 2) Bauen: Web-Seiten (sharp → WebP), Suchindex (Embeddings), PDFs (Playwright-Chromium im Image)
  - name: "mcr.microsoft.com/playwright:v1.55.0-noble"
    id: build
    dir: klickanleitungen
    entrypoint: bash
    secretEnv: ["OPENAI_API_KEY"]
    args:
      - "-c"
      - |
        set -euo pipefail
        export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
        npm ci --no-audit --no-fund
        bash portal/build.sh all
        du -sh portal/dist

  # 3) Image bauen und veröffentlichen
  - name: "gcr.io/cloud-builders/docker"
    id: image
    args: ["build", "-t", "${_IMAGE}", "-f", "klickanleitungen/portal/Dockerfile", "klickanleitungen/portal"]
  - name: "gcr.io/cloud-builders/docker"
    id: push
    args: ["push", "${_IMAGE}"]

  # 4) Deploy — ohne öffentlichen Zugang, nur vom Load Balancer (IAP) aus erreichbar
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud run deploy ${_SERVICE} \
          --image ${_IMAGE} \
          --region ${_REGION} \
          --project ${PROJECT_ID} \
          --platform managed \
          --no-allow-unauthenticated \
          --ingress internal-and-cloud-load-balancing \
          --memory 512Mi --cpu 1 \
          --min-instances 0 --max-instances 3 \
          --set-secrets OPENAI_API_KEY=openai-api-key:latest \
          --update-env-vars "BUILD_COMMIT=${SHORT_SHA}"

images:
  - "${_IMAGE}"
