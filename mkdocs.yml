site_name: glatttHub Dokumentation
site_description: Technische Dokumentation der glatttHub Web-Applikation — Architektur, Module, Integrationen, Betrieb. Bedienungsanleitungen für Mitarbeiterinnen stehen im Nutzerhandbuch hilfe.hub.glattt.com.
site_url: https://janglattt.github.io/glattthub-wiki/
repo_url: https://github.com/JanGlattt/glattthub-wiki
repo_name: JanGlattt/glattthub-wiki
edit_uri: edit/main/docs/
copyright: glattt · Labrado &amp; Schlüter — interne technische Dokumentation

# Tote Verweise brechen den Bau (seit 19.09.2026 sind alle bereinigt) —
# `mkdocs build --strict` im Deploy scheitert damit bei einem falschen Link oder Anker.
validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn
  omitted_files: warn
  absolute_links: warn

theme:
  name: material
  language: de
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dunkel
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Hell
  # Hausschrift des Hubs (FontSetting::DEFAULT_FAMILY) — Google Fonts, Fallback-Stack in extra.css
  font:
    text: Lato
    code: JetBrains Mono
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  logo: assets/glattt-icon.png
  favicon: assets/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JanGlattt/glattthub-wiki
      name: Wiki-Repository
    - icon: material/book-open-page-variant
      link: https://hilfe.hub.glattt.com
      name: Nutzerhandbuch (hilfe.hub.glattt.com)
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: de
  - git-revision-date-localized:
      type: date
      locale: de
      fallback_to_build_date: true
      enable_creation_date: false
  - minify:
      minify_html: true
  - swagger-ui-tag:
      docExpansion: list
      tryItOutEnabled: true
      syntaxHighlightTheme: monokai

